model_list:
  - model_name: neuro-planner
    litellm_params:
      model: openrouter/qwen/qwen3-coder:free
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0.2
      max_tokens: 8192
  - model_name: neuro-planner
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      temperature: 0.2
      max_tokens: 8192
  - model_name: neuro-executor
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      temperature: 0.1
      max_tokens: 8192
  - model_name: neuro-executor
    litellm_params:
      model: groq/meta-llama/llama-4-scout-17b-16e-instruct
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.1
      max_tokens: 8192
  - model_name: neuro-coder
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      temperature: 0.0
      max_tokens: 4096
  - model_name: neuro-coder
    litellm_params:
      model: openrouter/qwen/qwen3-coder:free
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0.0
      max_tokens: 4096
  - model_name: neuro-debugger
    litellm_params:
      model: groq/qwen/qwen3-32b
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.1
      max_tokens: 8192
  - model_name: neuro-observer
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.0
      max_tokens: 512
  - model_name: neuro-condenser
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      temperature: 0.1
      max_tokens: 4096

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  timeout: 120
  allowed_fails: 2
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
