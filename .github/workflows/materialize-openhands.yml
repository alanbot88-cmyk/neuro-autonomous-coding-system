name: Materialize OpenHands source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Materialize OpenHands with Neuro overlay
        run: |
          chmod +x scripts/materialize_openhands.sh
          bash scripts/materialize_openhands.sh

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize OpenHands source with Neuro overlay" || echo "No changes to commit"
          git push
